name: NEXA v1 CI

# NEXA-M1-009. Gates run on every push and pull request to nexa-v1-core, and
# on pull requests to main (where work is now merged; tests only, no deploy).
# Deploy jobs run only on push (never on pull requests, so forked code can not
# reach a self-hosted runner) and only when the repository variable
# NEXA_DEPLOY_ENABLED is "true". The QA job waits on the "qa" environment, which
# must have Required reviewers set in GitHub (Settings > Environments > qa).

on:
  push:
    branches: [nexa-v1-core]
  pull_request:
    branches: [nexa-v1-core, main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL with pgvector for the M2-004 store tests (NEXA-ADR-0002).
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            v1/requirements-dev.txt
            v1/*/requirements.txt

      - name: Install OCR engine (M2 ingestion tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v1/requirements-dev.txt

      - name: Lint (pyflakes subset, honors noqa)
        run: ruff check --select F v1

      - name: Compile check
        run: python -m compileall -q v1

      - name: Import-rule check (service boundaries)
        run: python v1/tools/check_imports.py

      - name: Enable pgvector in the test database
        env:
          PGPASSWORD: ci-only-not-a-secret
        run: psql -h 127.0.0.1 -U postgres -d nexa_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Unit and integration tests
        env:
          NEXA_TEST_PG_DSN: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/nexa_test
        run: |
          python -m pytest v1/tests -q -rs
          # The pgvector tests must run in CI, never skip.
          python -m pytest v1/tests/test_knowledge_indexing.py v1/tests/test_knowledge_retrieval.py -q -k pgvector -rs | tee pg.log
          ! grep -q "skipped" pg.log

      - name: RAG evaluation gate (NEXA-M2-008 fixture suite)
        # Authority conflicts, school vs national scope, access, citation
        # integrity and failure behaviour, deterministically. Every check must
        # pass. The corpus suite (real models) gates deploys in deploy.sh.
        run: python v1/tools/nexa_eval.py fixture --out eval-report

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-eval-fixture
          path: eval-report/

      - name: Config validation gate
        run: |
          python - <<'PY'
          from v1.shared.config import missing
          from v1.model_gateway import registry
          # A required var that is unset must be reported, proving the gate works.
          assert "NEXA_CI_UNSET_CHECK" in missing(["NEXA_CI_UNSET_CHECK"])
          # The example model config must stay valid.
          registry.reload("v1/model_gateway/models.example.json")
          print("config validation gate OK")
          PY

      - name: Dependency and security scan (pip-audit with time-boxed exceptions)
        # Fails on any advisory not listed in v1/security/audit-exceptions.json for
        # that exact version, on an expired exception, and on a stale one.
        run: python v1/tools/audit_gate.py

      - name: Version artifact
        id: version
        run: |
          VERSION="nexa-v1-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "$VERSION built $(date -u +%FT%TZ)" > nexa-version.txt
          tar czf "$VERSION.tar.gz" v1
          sha256sum "$VERSION.tar.gz" >> nexa-version.txt
          cat nexa-version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-version
          path: |
            nexa-version.txt
            nexa-v1-*.tar.gz

  deploy-dev:
    needs: build-test
    if: github.event_name == 'push' && vars.NEXA_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, nexa-dev]
    environment: dev
    concurrency: nexa-deploy-dev
    steps:
      - name: Checkout (for the deploy script at this commit)
        uses: actions/checkout@v4
      - name: Deploy to DEV with health gate and automatic rollback
        env:
          NEXA_HOME: ${{ vars.NEXA_HOME_DEV }}
        run: bash v1/deploy/deploy.sh "$GITHUB_SHA"

  promote-qa:
    needs: deploy-dev
    if: github.event_name == 'push' && vars.NEXA_DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, nexa-qa]
    environment: qa          # approval gate: configure Required reviewers
    concurrency: nexa-deploy-qa
    steps:
      - name: Checkout (for the deploy script at this commit)
        uses: actions/checkout@v4
      - name: Promote to QA with health gate and automatic rollback
        env:
          NEXA_HOME: ${{ vars.NEXA_HOME_QA }}
        run: bash v1/deploy/deploy.sh "$GITHUB_SHA"
